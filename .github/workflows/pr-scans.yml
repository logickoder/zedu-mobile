name: PR scans

# Caller: the logic lives in zedu-hng/zedu-ci (pr-scans.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Replaces the Semgrep part of Zedu's Security checks and the ClamAV part of Malware scan (disabled in
# zedu-hng; their files stay as upstream). Same rule packs, paths and excludes.

on:
  pull_request:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions: {}

concurrency:
  group: pr-scans-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scans:
    name: PR scans
    if: github.repository == 'zedu-hng/zedu-mobile'
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-scans.yml@67a7095475744c9976645efd77b54f1c0dcf1e82
    with:
      semgrep_configs: p/typescript p/react p/security-audit
      semgrep_paths: src App.tsx
      clamav_exclude_dirs: node_modules android/build android/.gradle ios/build ios/Pods
