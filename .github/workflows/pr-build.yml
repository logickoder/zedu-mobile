name: PR build

# Runs in contributor forks (on the fork's Actions minutes) and calls zedu-hng/zedu-ci (pr-build-react-native.yml),
# pinned by commit. Builds only when the branch has an open PR into zedu-hng/zedu-mobile, against our dev
# backend, or the host on the PR description's `Backend URL:` line. The review repo's Fork build check
# reads the result. First build after opening a PR: Actions -> PR build -> Run workflow on the branch
# (or push a commit). No fork setup needed.

# No paths-ignore: a docs-only push on top of code changes still needs a build for its head commit,
# or the review repo's Fork build check has nothing to read for it.
on:
  push:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pr-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PR build
    permissions:
      contents: read
    uses: zedu-hng/zedu-ci/.github/workflows/pr-build-react-native.yml@67a7095475744c9976645efd77b54f1c0dcf1e82
