name: PR rules

# Caller: the logic lives in zedu-hng/zedu-ci (pr-rules.yml), pinned by commit. This file sets the
# triggers, concurrency and token permissions. Keep the file name: other workflows look it up.
# Branch name, Single author, Protected files, Size, PR title and PR template, each a commit status.

on:
  pull_request_target:
    branches:
      - dev
      - central-staging
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    name: PR rules
    if: vars.IS_BOOTCAMP == 'true'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: zedu-hng/zedu-ci/.github/workflows/pr-rules.yml@67a7095475744c9976645efd77b54f1c0dcf1e82
    with:
      protected: '^(\.github/|AGENTS\.md$|CONTRIBUTING\.md$|\.eslintrc|\.prettierrc|\.prettierignore$|tsconfig\.json$|babel\.config\.js$|metro\.config\.js$|jest\.config\.js$|jest\.setup\.js$|commitlint\.config|\.gitleaks\.toml$|\.husky/|\.npmrc$|android/app/google-services\.json$|ios/GoogleService-Info\.plist$)'
      size_exclude: '(^|/)(package-lock\.json|yarn\.lock|pnpm-lock\.yaml|Podfile\.lock|Gemfile\.lock)$'
      template: .github/PULL_REQUEST_TEMPLATE.md
      # Team PRs are allowed: these three rules are switched off, not removed. They still post their status,
      # as passed, so required checks keep reporting. Set a line to true (or delete it) to enforce it again.
      enforce_single_author: false
      enforce_branch_name: false
      enforce_size: false
